<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Monoton&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110F;
    --surface: #1C1815;
    --surface-2: #241F1B;
    --border: #2E2823;
    --text: #F5F1EA;
    --text-dim: #8A8278;
    --text-muted: #5A5249;
    --accent: #E8A33D;
    --accent-dim: #8A6224;
    --danger: #C45842;
    --success: #7FA86B;
    /* retro accents */
    --pink: #FF3D7F;
    --magenta: #FF006E;
    --cyan: #4ECDC4;
    --neon: #FFE66D;
    --purple: #B388EB;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
    --serif: 'Fraunces', Georgia, serif;
    --retro: 'Monoton', 'Fraunces', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.5;
    overscroll-behavior-y: contain;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
    background-image:
      radial-gradient(ellipse at top, rgba(232,163,61,0.04) 0%, transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(124,168,107,0.02) 0%, transparent 50%);
  }

  header {
    padding: max(20px, env(safe-area-inset-top)) 20px 16px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-family: var(--serif);
    font-weight: 800;
    font-size: 28px;
    letter-spacing: -0.02em;
  }
  header h1 .dot { color: var(--accent); }
  header .date { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }

  main {
    padding: 0 20px 100px;
    max-width: 640px;
    margin: 0 auto;
  }
  main > section { padding-top: 20px; }

  .tab { display: none; }
  .tab.active { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .section-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--text-muted);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .section-label .meta { font-size: 10px; color: var(--text-muted); letter-spacing: 0.1em; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px 18px;
    margin-bottom: 18px;
  }

  /* ===== SYNTHWAVE HERO ===== */
  .hero {
    position: relative;
    margin: 0 -20px 18px;
    height: 140px;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }
  .hero svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .hero-title {
    position: absolute;
    top: 14px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: var(--retro);
    font-size: 28px;
    letter-spacing: 0.1em;
    color: var(--neon);
    text-shadow:
      0 0 8px rgba(255, 230, 109, 0.6),
      0 0 16px rgba(255, 61, 127, 0.4),
      2px 2px 0 rgba(255, 0, 110, 0.5);
    pointer-events: none;
    z-index: 2;
  }
  .hero-quote {
    position: absolute;
    bottom: 12px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: var(--serif);
    font-style: italic;
    font-size: 12px;
    color: var(--text);
    text-shadow: 0 1px 4px rgba(0,0,0,0.8), 0 0 8px rgba(255, 61, 127, 0.3);
    padding: 0 20px;
    z-index: 2;
    letter-spacing: 0.02em;
  }

  /* ===== TODAY STATS ===== */
  .today-banner {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 22px;
  }
  .stat-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px 8px;
    text-align: center;
  }
  .stat-pill .label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .stat-pill .val {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 18px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .stat-pill .val.active { color: var(--accent); }
  .stat-pill .val.val-fast { color: #B388EB; }
  .stat-pill .val.val-weight { color: #FF3D7F; }
  .stat-pill .val.muted { color: var(--text-muted); }

  /* ===== BADGES ===== */
  .badges-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 4px 14px;
    margin: 0 -20px 16px;
    padding-left: 20px;
    padding-right: 20px;
    scrollbar-width: none;
  }
  .badges-strip::-webkit-scrollbar { display: none; }

  .badge {
    flex: 0 0 auto;
    width: 76px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .badge:active { transform: scale(0.95); }
  .badge-circle {
    position: relative;
    width: 56px;
    height: 56px;
    margin: 0 auto 6px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 2px solid var(--badge-color, var(--accent));
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      inset 0 0 12px rgba(0,0,0,0.4);
  }
  .badge.earned .badge-circle {
    background: radial-gradient(circle at 30% 30%, color-mix(in srgb, var(--badge-color) 25%, transparent), var(--surface) 70%);
    box-shadow:
      0 0 12px color-mix(in srgb, var(--badge-color) 40%, transparent),
      inset 0 0 12px rgba(0,0,0,0.3);
  }
  .badge.locked .badge-circle {
    filter: grayscale(0.8);
    opacity: 0.35;
  }
  .badge-icon {
    font-family: var(--retro);
    font-size: 14px;
    color: var(--badge-color, var(--accent));
    letter-spacing: 0.05em;
    line-height: 1;
    text-align: center;
  }
  .badge-icon.tall { font-size: 18px; }
  .badge-icon.short { font-size: 11px; }
  .badge-name {
    font-size: 9px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    line-height: 1.2;
    height: 20px;
  }
  .badge.earned .badge-name { color: var(--text-dim); }
  .badge-count-display {
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 4px;
    padding: 10px;
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    cursor: pointer;
    flex: 0 0 auto;
    width: 76px;
    height: 88px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
  }
  .badge-count-display strong {
    font-family: var(--retro);
    font-size: 16px;
    color: var(--accent);
    letter-spacing: 0.05em;
  }

  /* ===== INPUTS ===== */
  .row { display: flex; gap: 10px; align-items: center; }

  input[type="number"], input[type="text"], textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 12px 14px;
    border-radius: 3px;
    width: 100%;
    font-variant-numeric: tabular-nums;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 90px; resize: vertical; line-height: 1.6; }

  button.primary, button.secondary, button.danger {
    padding: 14px 18px;
    border: none;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: all 0.15s;
  }
  button.primary { background: var(--accent); color: var(--bg); }
  button.primary:active { background: #C8881F; transform: scale(0.98); }
  button.primary:disabled { background: var(--surface-2); color: var(--text-muted); cursor: not-allowed; }
  button.primary.weight { background: #FF3D7F; color: #fff; }
  button.primary.weight:active { background: #E12668; }
  button.primary.cardio { background: #4ECDC4; color: #14110F; }
  button.primary.cardio:active { background: #2CA89F; }
  button.primary.fast   { background: #B388EB; color: #14110F; }
  button.primary.fast:active { background: #9764D6; }
  button.secondary { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  button.secondary:active { background: var(--surface-2); }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  button.danger:active { background: rgba(196, 88, 66, 0.15); }
  button.danger.fast { color: #B388EB; border-color: #B388EB; }
  button.danger.fast:active { background: rgba(179, 136, 235, 0.15); }

  .button-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .move-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-top: 3px solid var(--type-color, var(--border));
    border-radius: 4px;
    padding: 12px 12px 14px;
    cursor: pointer;
    text-align: left;
    color: inherit;
    font: inherit;
    transition: all 0.15s;
  }
  .move-card.type-lift   { --type-color: #E8A33D; }
  .move-card.type-cardio { --type-color: #4ECDC4; }
  .move-card:active { transform: scale(0.97); background: var(--bg); }
  .move-card .title { font-family: var(--serif); font-weight: 600; font-size: 16px; margin-bottom: 2px; color: var(--type-color, var(--text)); }
  .move-card .sub { font-size: 10px; color: var(--text-muted); letter-spacing: 0.05em; }
  .move-card.suggested { border-color: var(--accent-dim); }
  .move-card.suggested .title { color: #FFE66D; }

  /* ===== FAST INLINE ===== */
  .fast-inline { display: flex; align-items: center; gap: 14px; }
  .fast-inline .time-block { flex: 1; min-width: 0; }
  .fast-inline .time {
    font-family: var(--serif);
    font-weight: 800;
    font-size: 26px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .fast-inline .time.dim { color: var(--text-muted); }
  .fast-inline .progress-row { margin-top: 8px; font-size: 10px; color: var(--text-muted); letter-spacing: 0.05em; }

  .progress-track { height: 3px; background: var(--border); border-radius: 2px; margin: 8px 0; overflow: hidden; }
  .progress-fill { height: 100%; background: #B388EB; transition: width 0.5s ease; border-radius: 2px; }
  .progress-fill.complete { background: var(--success); }

  .fast-started-row {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--text-dim);
  }
  .edit-link {
    background: none;
    border: none;
    color: #B388EB;
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    cursor: pointer;
    padding: 4px 0;
  }

  /* ===== ACTIVE WORKOUT ===== */
  .active-workout h2 { font-family: var(--serif); font-size: 22px; margin-bottom: 4px; }
  .active-workout .focus { font-size: 11px; color: var(--text-dim); margin-bottom: 16px; letter-spacing: 0.05em; }

  .exercise-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 0;
    border-top: 1px solid var(--border);
    cursor: pointer;
  }
  .exercise-row:last-of-type { border-bottom: 1px solid var(--border); }

  .checkbox {
    width: 22px;
    height: 22px;
    border: 1.5px solid var(--text-muted);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .checkbox.checked { background: var(--accent); border-color: var(--accent); }
  .checkbox.checked::after { content: '✓'; color: var(--bg); font-weight: 700; font-size: 14px; }

  .exercise-row.done .exercise-name { color: var(--text-muted); text-decoration: line-through; }
  .exercise-info { flex: 1; }
  .exercise-name { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
  .exercise-sets { font-size: 11px; color: var(--text-muted); letter-spacing: 0.05em; }

  .button-row { display: flex; gap: 10px; margin-top: 18px; }
  .button-row button { flex: 1; }

  /* ===== RECENT (grouped by day) ===== */
  .day-group { margin-bottom: 10px; }
  .day-group:last-child { margin-bottom: 0; }
  .day-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 14px 0 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 6px;
  }
  .day-group:first-child .day-header { padding-top: 6px; }
  .day-label {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.01em;
    color: var(--text);
  }
  .day-label.today { color: var(--accent); }
  .day-meta {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-muted);
  }
  .day-rest {
    padding: 8px 0 4px 12px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 12px;
    color: var(--text-muted);
  }

  .recent-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px 10px 11px;
    border-left: 3px solid var(--type-color, var(--accent));
    margin-bottom: 2px;
    cursor: pointer;
    transition: background 0.15s;
    border-radius: 0 2px 2px 0;
  }
  .recent-row:active { background: var(--surface-2); }
  .recent-row.type-lift   { --type-color: #E8A33D; }
  .recent-row.type-cardio { --type-color: #4ECDC4; }
  .recent-row.type-weight { --type-color: #FF3D7F; }
  .recent-row.type-fast   { --type-color: #B388EB; }

  .recent-type {
    color: var(--type-color);
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    min-width: 58px;
    flex-shrink: 0;
  }
  .recent-detail {
    flex: 1;
    font-size: 12px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .recent-time {
    font-size: 10px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .empty {
    color: var(--text-muted);
    font-size: 12px;
    padding: 14px 0;
    font-style: italic;
    font-family: var(--serif);
    text-align: center;
  }

  /* ===== TRENDS ===== */
  .trend-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .trend-card .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .trend-card .title { font-family: var(--serif); font-weight: 600; font-size: 18px; }
  .trend-card .current {
    font-family: var(--serif);
    font-weight: 800;
    font-size: 22px;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .trend-card .current .unit { font-size: 13px; color: var(--text-muted); margin-left: 2px; }
  .trend-card .stats {
    display: flex;
    gap: 16px;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 14px;
    margin-top: 4px;
    flex-wrap: wrap;
  }
  .trend-card .stats .down { color: var(--success); }
  .trend-card .stats .up { color: var(--danger); }

  .range-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .range-tab {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: var(--mono);
    font-size: 10px;
    padding: 4px 10px;
    border-radius: 2px;
    cursor: pointer;
    letter-spacing: 0.1em;
  }
  .range-tab.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  svg.chart { width: 100%; height: 160px; display: block; }
  svg.bar-chart { width: 100%; height: 140px; display: block; }

  .chart-legend {
    display: flex;
    gap: 14px;
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 8px;
    padding-left: 36px;
  }
  .chart-legend .swatch { display: inline-block; width: 10px; height: 2px; vertical-align: middle; margin-right: 4px; }

  /* ===== NAV ===== */
  nav.tabbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(20, 17, 15, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 8px max(8px, env(safe-area-inset-bottom));
    z-index: 100;
  }
  nav.tabbar button {
    flex: 1;
    background: none;
    border: none;
    padding: 12px 8px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    color: var(--text-muted);
    cursor: pointer;
    text-transform: uppercase;
    border-radius: 4px;
    transition: color 0.15s;
  }
  nav.tabbar button.active { color: var(--accent); }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    z-index: 200;
    max-width: calc(100% - 40px);
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.achievement {
    background: var(--pink);
    color: white;
    border: 1px solid var(--neon);
    box-shadow: 0 0 20px rgba(255, 61, 127, 0.5), 0 4px 12px rgba(0,0,0,0.5);
    padding: 14px 22px;
  }
  .toast.achievement .ach-label {
    font-family: var(--retro);
    font-size: 10px;
    display: block;
    color: var(--neon);
    margin-bottom: 4px;
    letter-spacing: 0.2em;
  }
  .toast.achievement .ach-name {
    font-family: var(--serif);
    font-size: 14px;
    text-transform: none;
    letter-spacing: 0;
    font-style: italic;
  }

  /* ===== MODAL ===== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 300;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-backdrop.show { display: flex; animation: fadeIn 0.2s ease; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px 8px 0 0;
    width: 100%;
    max-width: 600px;
    padding: 24px 20px max(24px, env(safe-area-inset-bottom));
    animation: slideUp 0.25s ease;
    max-height: 90vh;
    overflow-y: auto;
  }
  @keyframes slideUp { from { transform: translateY(40px); } to { transform: translateY(0); } }
  .modal h3 { font-family: var(--serif); font-size: 20px; margin-bottom: 6px; font-weight: 600; }
  .modal .modal-sub { font-size: 11px; color: var(--text-dim); margin-bottom: 18px; letter-spacing: 0.05em; }
  .modal label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    margin-bottom: 6px;
    margin-top: 14px;
  }
  .modal label:first-of-type { margin-top: 0; }

  /* ===== WHEEL DATE/TIME PICKER ===== */
  .dt-picker {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 8px;
  }
  .dt-display {
    text-align: center;
    font-family: var(--serif);
    font-weight: 600;
    font-size: 16px;
    color: var(--accent);
    padding: 8px 0 14px;
    letter-spacing: 0.01em;
  }
  .dt-wheels {
    position: relative;

<script>
'use strict';

/* ===== STORAGE ===== */
const Store = {
  get(key, fallback) {
    try {
      const v = localStorage.getItem(key);
      return v === null ? fallback : JSON.parse(v);
    } catch { return fallback; }
  },
  set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} },
  remove(key) { try { localStorage.removeItem(key); } catch {} }
};

const KEYS = ['sessions','fast','weights','activeWorkout','lastTab','weightRange','achievements'];

/* ===== PROGRAM ===== */
const PROGRAM = {
  A: {
    title: 'Workout A',
    focus: 'Push / Squat / Core',
    exercises: [
      { name: 'Goblet Squat to Chair',     sets: '3 × 10' },
      { name: 'Push-Ups',                  sets: '3 × max-1' },
      { name: 'Single-Arm DB Row',         sets: '3 × 10 / side' },
      { name: 'Glute Bridge / Hip Thrust', sets: '3 × 15' },
      { name: 'Plank',                     sets: '3 × 30–45s' }
    ]
  },
  B: {
    title: 'Workout B',
    focus: 'Hinge / Pull / Core',
    exercises: [
      { name: 'Romanian Deadlift (DB)',  sets: '3 × 10' },
      { name: 'Reverse Lunge',           sets: '3 × 8 / side' },
      { name: 'Overhead Press (DB)',     sets: '3 × 8–10' },
      { name: 'Dead Bug',                sets: '3 × 10 / side' },
      { name: 'Side Plank',              sets: '3 × 20–30s / side' }
    ]
  }
};
const WEEK_GOAL = 2;

/* ===== QUOTES ===== */
const QUOTES = [
  "The barbell doesn't know your story.",
  "Show up — especially when you don't feel like it.",
  "The pain you feel today will be the strength you feel tomorrow.",
  "Discipline is choosing what you want most over what you want now.",
  "Small steps. Every day. That's the whole game.",
  "It never gets easier. You just get better.",
  "Train hard. Recover harder.",
  "What gets measured gets managed.",
  "The work works.",
  "You vs. you. Nobody else.",
  "Strength comes from an indomitable will.",
  "Stop talking. Start lifting.",
  "Hard now. Easy later.",
  "Champions are made on the days nobody's watching."
];

function quoteOfTheDay() {
  const d = new Date();
  const dayOfYear = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
  return QUOTES[dayOfYear % QUOTES.length];
}

/* ===== ACHIEVEMENTS ===== */
const ACHIEVEMENTS = [
  // workouts - amber
  { id: 'first-lift', name: 'First Lift', icon: '01', cls: 'short', color: '#E8A33D', desc: 'Complete your first workout.', check: d => d.lifts >= 1 },
  { id: 'lift-5', name: '5 Sessions', icon: '05', cls: 'short', color: '#E8A33D', desc: '5 workouts logged.', check: d => d.lifts >= 5 },
  { id: 'lift-25', name: '25 Sessions', icon: '25', cls: 'short', color: '#E8A33D', desc: '25 workouts. Habit territory.', check: d => d.lifts >= 25 },
  { id: 'lift-100', name: 'Century', icon: '100', cls: 'short', color: '#FFE66D', desc: '100 workouts logged. Legend tier.', check: d => d.lifts >= 100 },
  { id: 'week-goal', name: 'Week Hit', icon: '✦', cls: 'tall', color: '#E8A33D', desc: 'Hit your weekly lift goal for the first time.', check: d => d.weeklyGoalHits >= 1 },
  { id: 'week-streak-4', name: 'Month Strong', icon: '4w', cls: 'short', color: '#FFE66D', desc: 'Four weeks at goal in a row.', check: d => d.maxWeekStreak >= 4 },

  // cardio - cyan
  { id: 'first-mile', name: 'On the Road', icon: '▷', cls: 'tall', color: '#4ECDC4', desc: 'Log your first walk or run.', check: d => d.miles >= 0.5 },
  { id: 'miles-25', name: '25 Mile Club', icon: '25', cls: 'short', color: '#4ECDC4', desc: '25 total miles covered.', check: d => d.miles >= 25 },
  { id: 'miles-100', name: 'Triple Digit', icon: '100', cls: 'short', color: '#4ECDC4', desc: '100 total miles.', check: d => d.miles >= 100 },
  { id: 'long-run', name: 'Long Run', icon: '5+', cls: 'short', color: '#FFE66D', desc: 'A single session of 5+ miles.', check: d => d.longestRun >= 5 },

  // weight - hot pink
  { id: 'first-weight', name: 'Step On', icon: '◯', cls: 'tall', color: '#FF3D7F', desc: 'Log your first weight.', check: d => d.weighIns >= 1 },
  { id: 'weight-streak-7', name: 'Daily Habit', icon: '7d', cls: 'short', color: '#FF3D7F', desc: 'Weigh in 7 days in a row.', check: d => d.weightStreak >= 7 },
  { id: 'lost-5', name: '-5 lb', icon: '-5', cls: 'short', color: '#FF3D7F', desc: 'Down 5 pounds from your starting weight.', check: d => d.weightLost >= 5 },
  { id: 'lost-10', name: '-10 lb', icon: '-10', cls: 'short', color: '#FF3D7F', desc: 'Down 10 pounds.', check: d => d.weightLost >= 10 },
  { id: 'lost-20', name: '-20 lb', icon: '-20', cls: 'short', color: '#FF3D7F', desc: 'Down 20 pounds. Real progress.', check: d => d.weightLost >= 20 },
  { id: 'lost-30', name: '-30 lb', icon: '-30', cls: 'short', color: '#FFE66D', desc: 'Thirty pounds gone. New you.', check: d => d.weightLost >= 30 },
  { id: 'bmi-30', name: 'Under 30', icon: 'BMI', cls: 'short', color: '#FFE66D', desc: 'BMI under 30 (assumes 6\'2"). The line crossed.', check: d => d.bmi !== null && d.bmi < 30 },

  // fasting - purple
  { id: 'first-fast', name: 'First Fast', icon: '◌', cls: 'tall', color: '#B388EB', desc: 'Complete your first fast.', check: d => d.fasts >= 1 },
  { id: 'fast-goal-hit', name: 'On Target', icon: '◎', cls: 'tall', color: '#B388EB', desc: 'Hit your fast goal once.', check: d => d.fastGoalHits >= 1 },
  { id: 'fast-24', name: '24h Fast', icon: '24h', cls: 'short', color: '#FFE66D', desc: 'Complete a 24+ hour fast.', check: d => d.maxFastHours >= 24 },
  { id: 'fasts-10', name: '10 Fasts', icon: '10', cls: 'short', color: '#B388EB', desc: '10 fasts logged.', check: d => d.fasts >= 10 },
  { id: 'fasts-50', name: '50 Fasts', icon: '50', cls: 'short', color: '#B388EB', desc: '50 fasts logged. Steady.', check: d => d.fasts >= 50 }
];

const HEIGHT_INCHES = 74; // 6'2", used for BMI calculations

function computeAchievementData() {
  const sessions = getSessions();
  const weights = getWeights().slice().sort((a,b) => a.date.localeCompare(b.date));
  const fast = getFastState();

  const lifts = sessions.filter(s => ['A','B','Custom'].includes(s.type)).length;
  const miles = sessions.filter(s => s.type === 'Walk/Run').reduce((s, x) => s + (x.miles||0), 0);
  const longestRun = sessions.filter(s => s.type === 'Walk/Run').reduce((m, s) => Math.max(m, s.miles||0), 0);
  const weighIns = weights.length;
  const weightLost = weighIns >= 2 ? weights[0].value - weights[weights.length-1].value : 0;
  const currentWeight = weighIns > 0 ? weights[weights.length-1].value : null;
  const bmi = currentWeight ? (currentWeight / (HEIGHT_INCHES * HEIGHT_INCHES)) * 703 : null;

  // weight streak: consecutive days ending today (or the most recent entry)
  let weightStreak = 0;
  if (weighIns > 0) {
    const dates = new Set(weights.map(w => w.date));
    const today = new Date();
    today.setHours(0,0,0,0);
    for (let i = 0; i < 90; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() - i);
      const iso = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      if (dates.has(iso)) weightStreak++;
      else if (i > 0) break;
      else continue;
    }
  }

  // Weekly goal streaks
  const liftDates = sessions.filter(s => ['A','B','Custom'].includes(s.type)).map(s => isoWeek(new Date(s.date)));
  const weekCounts = {};
  liftDates.forEach(w => { weekCounts[w] = (weekCounts[w]||0) + 1; });
  const weeklyGoalHits = Object.values(weekCounts).filter(c => c >= WEEK_GOAL).length;

  // Compute max consecutive weeks at goal
  let maxWeekStreak = 0;
  const sortedWeeks = Object.keys(weekCounts).sort();
  if (sortedWeeks.length > 0) {
    let current = 1;
    let prevWeek = sortedWeeks[0];
    if (weekCounts[prevWeek] < WEEK_GOAL) current = 0;
    maxWeekStreak = current;
    for (let i = 1; i < sortedWeeks.length; i++) {
      const w = sortedWeeks[i];
      if (weekCounts[w] >= WEEK_GOAL) {
        // check if consecutive
        if (consecutiveISOWeeks(prevWeek, w)) current++;
        else current = 1;
      } else {
        current = 0;
      }
      maxWeekStreak = Math.max(maxWeekStreak, current);
      prevWeek = w;
    }
  }

  const fasts = fast.history.length;
  const fastGoalHits = fast.history.filter(f => (new Date(f.end) - new Date(f.start))/3600/1000 >= (f.goal||17)).length;
  const maxFastHours = fast.history.reduce((m, f) => Math.max(m, (new Date(f.end) - new Date(f.start))/3600/1000), 0);

  return { lifts, miles, longestRun, weighIns, weightLost, weightStreak, weeklyGoalHits, maxWeekStreak, fasts, fastGoalHits, maxFastHours, bmi };
}

function consecutiveISOWeeks(a, b) {
  // a, b like "2026-W14"
  const [ay, aw] = a.split('-W').map(Number);
  const [by, bw] = b.split('-W').map(Number);
  if (ay === by) return bw === aw + 1;
  if (by === ay + 1) {
    // Year boundary - simple heuristic
    return (aw >= 52) && bw === 1;
  }
  return false;
}

function checkAchievements() {
  const data = computeAchievementData();
  const earned = Store.get('achievements', {});
  const newlyEarned = [];

  ACHIEVEMENTS.forEach(a => {
    if (!earned[a.id] && a.check(data)) {
      earned[a.id] = new Date().toISOString();
      newlyEarned.push(a);
    }
  });

  if (newlyEarned.length > 0) {
    Store.set('achievements', earned);
    newlyEarned.forEach((a, i) => {
      setTimeout(() => showAchievementToast(a), i * 2200);
    });
  }
  return earned;
}

function showAchievementToast(a) {
  const t = document.getElementById('toast');
  t.innerHTML = `<span class="ach-label">★ Achievement Unlocked</span><span class="ach-name">${a.name}</span>`;
  t.classList.add('show', 'achievement');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.classList.remove('achievement'), 300);
  }, 2000);
}

/* ===== UTILS ===== */
function pad(n) { return String(n).padStart(2, '0'); }

function fmtDuration(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return `${pad(Math.floor(s/3600))}:${pad(Math.floor((s%3600)/60))}:${pad(s%60)}`;
}
function fmtDurationShort(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  return h === 0 ? `${m}m` : `${h}h ${m}m`;
}
function isoWeek(d) {
  d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return `${d.getUTCFullYear()}-W${pad(Math.ceil((((d - yearStart) / 86400000) + 1) / 7))}`;
}
function weekStart(d) {
  const day = d.getDay() || 7;
  const s = new Date(d);
  s.setDate(d.getDate() - (day - 1));
  s.setHours(0, 0, 0, 0);
  return s;
}
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function fmtDate(iso) { return new Date(iso).toLocaleDateString('en-US', { month:'short', day:'numeric' }); }
function fmtDateLong(iso) { return new Date(iso).toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }); }
function fmtTime(iso) { return new Date(iso).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' }); }
function fmtDateTime(iso) {
  const d = new Date(iso);
  const today = new Date();
  const isToday = d.toDateString() === today.toDateString();
  const y = new Date(today); y.setDate(today.getDate()-1);
  const isYest = d.toDateString() === y.toDateString();
  const day = isToday ? 'Today' : isYest ? 'Yesterday' : d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
  return `${day} · ${fmtTime(iso)}`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.classList.remove('achievement');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ===== MODAL ===== */
function openModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}
function closeModal() {
  document.getElementById('modal').classList.remove('show');
}
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') closeModal();
});

/* ===== WHEEL DATE/TIME PICKER ===== */

function buildDayOptions(daysBack = 14) {
  const today = new Date();
  today.setHours(0,0,0,0);
  const options = [];
  for (let i = 0; i < daysBack; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() - i);
    let label;
    if (i === 0) label = 'Today';
    else if (i === 1) label = 'Yesterday';
    else label = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    options.push({ value: -i, label });
  }
  return options;
}

function buildHourOptions() {
  const options = [];
  for (let h = 0; h < 24; h++) {
    const period = h < 12 ? 'AM' : 'PM';
    const hour12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
    options.push({ value: h, label: `${hour12} ${period}` });
  }
  return options;
}

function buildMinuteOptions() {
  const options = [];
  for (let m = 0; m < 60; m += 5) {
    options.push({ value: m, label: pad(m) });
  }
  return options;
}

function setupDateTimePicker(container, initialIso) {
  const initial = new Date(initialIso || Date.now());
  const dayOpts = buildDayOptions(14);
  const hourOpts = buildHourOptions();
  const minOpts = buildMinuteOptions();
  const ITEM_H = 36;

  // Compute initial indices
  const today = new Date();
  today.setHours(0,0,0,0);
  const initialDay = new Date(initial);
  initialDay.setHours(0,0,0,0);
  let dayOffset = Math.round((initialDay - today) / 86400000);
  if (dayOffset > 0) dayOffset = 0; // future not allowed
  if (dayOffset < -13) dayOffset = -13;

  const initialDayIdx = Math.max(0, dayOpts.findIndex(o => o.value === dayOffset));
  const initialHourIdx = Math.max(0, hourOpts.findIndex(o => o.value === initial.getHours()));
  const initMin = Math.floor(initial.getMinutes() / 5) * 5;
  const initialMinIdx = Math.max(0, minOpts.findIndex(o => o.value === initMin));

  container.innerHTML = `
    <div class="dt-picker">
      <div class="dt-display" id="dt-display">${formatPicked(initial)}</div>
      <div class="dt-wheels">
        <div class="dt-indicator"></div>
        <div class="dt-wheel" data-wheel="day">
          <div class="dt-wheel-spacer"></div>
          ${dayOpts.map(o => `<div class="dt-item" data-value="${o.value}">${o.label}</div>`).join('')}
          <div class="dt-wheel-spacer"></div>
        </div>
        <div class="dt-wheel" data-wheel="hour">
          <div class="dt-wheel-spacer"></div>
          ${hourOpts.map(o => `<div class="dt-item" data-value="${o.value}">${o.label}</div>`).join('')}
          <div class="dt-wheel-spacer"></div>
        </div>
        <div class="dt-wheel" data-wheel="minute">
          <div class="dt-wheel-spacer"></div>
          ${minOpts.map(o => `<div class="dt-item" data-value="${o.value}">${o.label}</div>`).join('')}
          <div class="dt-wheel-spacer"></div>
        </div>
      </div>
      <button type="button" class="dt-now-btn" id="dt-now-${container.id}">↺ Now</button>
    </div>
  `;

  const wheels = container.querySelectorAll('.dt-wheel');
  const dayWheel = wheels[0];
  const hourWheel = wheels[1];
  const minWheel = wheels[2];

  function getIdx(wheel) {
    return Math.round(wheel.scrollTop / ITEM_H);
  }

  function setWheel(wheel, idx) {
    wheel.scrollTop = idx * ITEM_H;
  }

  function snapWheel(wheel) {
    const idx = getIdx(wheel);
    wheel.scrollTo({ top: idx * ITEM_H, behavior: 'smooth' });
  }

  function updateSelected() {
    wheels.forEach(w => {
      const idx = getIdx(w);
      w.querySelectorAll('.dt-item').forEach((it, i) => {
        it.classList.toggle('selected', i === idx);
      });
    });
    updateDisplay();
  }

  function updateDisplay() {
    const d = currentDate();
    document.getElementById('dt-display').textContent = formatPicked(d);
  }

  function currentDate() {
    const dayIdx = getIdx(dayWheel);
    const hourIdx = getIdx(hourWheel);
    const minIdx = getIdx(minWheel);
    const dayVal = dayOpts[Math.min(Math.max(dayIdx, 0), dayOpts.length-1)]?.value || 0;
    const hour = hourOpts[Math.min(Math.max(hourIdx, 0), hourOpts.length-1)]?.value || 0;
    const min = minOpts[Math.min(Math.max(minIdx, 0), minOpts.length-1)]?.value || 0;
    const d = new Date();
    d.setDate(d.getDate() + dayVal);
    d.setHours(hour, min, 0, 0);
    return d;
  }

  function formatPicked(d) {
    const today = new Date();
    today.setHours(0,0,0,0);
    const dd = new Date(d);
    dd.setHours(0,0,0,0);
    const diff = Math.round((dd - today) / 86400000);
    let dayPart;
    if (diff === 0) dayPart = 'Today';
    else if (diff === -1) dayPart = 'Yesterday';
    else dayPart = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    return `${dayPart} · ${d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}`;
  }

  // Set initial positions (do this after layout settles)
  requestAnimationFrame(() => {
    setWheel(dayWheel, initialDayIdx);
    setWheel(hourWheel, initialHourIdx);
    setWheel(minWheel, initialMinIdx);
    updateSelected();
  });

  // Scroll listeners with snap-on-stop
  wheels.forEach(w => {
    let timer;
    w.addEventListener('scroll', () => {
      // Update selection immediately for feedback
      const idx = getIdx(w);
      w.querySelectorAll('.dt-item').forEach((it, i) => {
        it.classList.toggle('selected', i === idx);
      });
      updateDisplay();
      clearTimeout(timer);
      timer = setTimeout(() => snapWheel(w), 100);
    });

    // Tap to select
    w.querySelectorAll('.dt-item').forEach((it, i) => {
      it.addEventListener('click', () => {
        w.scrollTo({ top: i * ITEM_H, behavior: 'smooth' });
        setTimeout(updateSelected, 250);
      });
    });
  });

  // Now button
  container.querySelector(`#dt-now-${container.id}`).addEventListener('click', () => {
    const now = new Date();
    const minVal = Math.floor(now.getMinutes() / 5) * 5;
    const hourIdx = hourOpts.findIndex(o => o.value === now.getHours());
    const minIdx = minOpts.findIndex(o => o.value === minVal);
    dayWheel.scrollTo({ top: 0, behavior: 'smooth' });
    hourWheel.scrollTo({ top: hourIdx * ITEM_H, behavior: 'smooth' });
    minWheel.scrollTo({ top: minIdx * ITEM_H, behavior: 'smooth' });
    setTimeout(updateSelected, 300);
  });

  return {
    getValue: () => currentDate().toISOString()
  };
}

function renderFastInline(fast) {
  const goalMs = fast.goalHours * 3600 * 1000;
  if (fast.start) {
    const elapsed = Date.now() - new Date(fast.start).getTime();
    const pct = Math.min(100, (elapsed / goalMs) * 100);
    const remaining = goalMs - elapsed;
    const remText = remaining > 0
      ? `${fmtDurationShort(remaining)} to ${fast.goalHours}h goal`
      : `+${fmtDurationShort(-remaining)} past goal`;
    return `
      <div class="fast-inline">
        <div class="time-block">
          <div class="time" id="fast-time">${fmtDuration(elapsed)}</div>
          <div class="progress-row">
            <div class="progress-track">
              <div class="progress-fill ${pct>=100?'complete':''}" id="fast-progress" style="width:${pct}%"></div>
            </div>
            <span id="fast-remaining">${remText}</span>
          </div>
        </div>
        <button class="danger fast" id="fast-toggle">End</button>
      </div>
      <div class="fast-started-row">
        <span>Started ${fmtDateTime(fast.start)}</span>
        <button class="edit-link" id="edit-fast-start">Edit time</button>
      </div>

  }
  return `

        <div class="progress-row">Goal: ${fast.goalHours}h · start when you finish eating</div>
      </div>
      <button class="primary fast" id="fast-toggle">Start</button>
    </div>
  `;
}

function renderRecentActivity() {
  // Build flat list of items, color-coded by type
  const items = [];

  getSessions().forEach((s, idx) => {
    let detail = '—';
    let typeLabel = s.type;
    let typeClass = 'type-lift';
    if (s.type === 'Walk/Run') {
      const parts = [];
      if (s.miles) parts.push(s.miles.toFixed(1) + ' mi');
      if (s.duration) parts.push(s.duration + ' min');
      detail = parts.length ? parts.join(' · ') : '—';
      typeLabel = 'Walk/Run';
      typeClass = 'type-cardio';
    } else if (s.type === 'Custom') {
      detail = s.notes ? (s.notes.length > 60 ? s.notes.slice(0, 60) + '…' : s.notes) : '—';
      typeLabel = 'Custom';
    } else {
      // A or B
      typeLabel = 'Lift ' + s.type;
      detail = PROGRAM[s.type] ? PROGRAM[s.type].focus : '—';
    }
    items.push({ ts: s.date, typeLabel, typeClass, detail, kind: 'session', idx });
  });

  getFastState().history.forEach((f, idx) => {
    const dur = new Date(f.end) - new Date(f.start);
    const hours = dur / 3600 / 1000;
    const hit = hours >= (f.goal || 17);
    items.push({
      ts: f.end,
      typeLabel: 'Fast',
      typeClass: 'type-fast',
      detail: `${fmtDurationShort(dur)}${hit ? ' ✓' : ''}`,
      kind: 'fast',
      idx,
      hideTime: false
    });
  });

  getWeights().forEach((w, idx) => {
    items.push({
      ts: w.date + 'T08:00:00',
      typeLabel: 'Weight',
      typeClass: 'type-weight',
      detail: w.value.toFixed(1) + ' lb',
      kind: 'weight',
      idx,
      hideTime: true
    });
  });

  if (items.length === 0) return '<div class="empty">Nothing logged yet.</div>';

  // Group by local day key (YYYY-MM-DD)
  function dayKey(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }
  const itemsByDay = {};
  items.forEach(it => {
    const k = dayKey(it.ts);
    if (!itemsByDay[k]) itemsByDay[k] = [];
    itemsByDay[k].push(it);
  });
  // Sort each day's items most-recent first
  Object.values(itemsByDay).forEach(arr => arr.sort((a, b) => new Date(b.ts) - new Date(a.ts)));

  // Build the last 7 days (so rest days are explicit)
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const groups = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() - i);
    const k = dayKey(d.toISOString());
    groups.push({ date: d, key: k, items: itemsByDay[k] || [] });
  }
  // Add older days that have entries (beyond the 7-day rest-day window)
  const olderKeys = Object.keys(itemsByDay)
    .filter(k => !groups.find(g => g.key === k))
    .sort((a, b) => b.localeCompare(a));
  olderKeys.slice(0, 7).forEach(k => {
    groups.push({ date: new Date(k + 'T12:00:00'), key: k, items: itemsByDay[k] });
  });

  const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);

  return groups.map(g => {
    const isToday = g.date.toDateString() === today.toDateString();
    const isYesterday = g.date.toDateString() === yesterday.toDateString();
    let label;
    if (isToday) label = 'Today';
    else if (isYesterday) label = 'Yesterday';
    else label = g.date.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });

    const meta = g.items.length > 0
      ? `<span class="day-meta">${g.items.length} ${g.items.length === 1 ? 'entry' : 'entries'}</span>`
      : '';

    const body = g.items.length === 0
      ? '<div class="day-rest">Rest day</div>'
      : g.items.map(it => `
          <div class="recent-row ${it.typeClass}" data-rec-kind="${it.kind}" data-rec-idx="${it.idx}">
            <span class="recent-type">${it.typeLabel}</span>
            <span class="recent-detail">${it.detail}</span>
            <span class="recent-time">${it.hideTime ? '' : fmtTime(it.ts)}</span>
          </div>
        `).join('');

    return `
      <div class="day-group">
        <div class="day-header">
          <span class="day-label ${isToday ? 'today' : ''}">${label}</span>
          ${meta}
        </div>
        ${body}
      </div>
    `;
  }).join('');
}

function renderActiveWorkout(view, active) {

function startFastTick() {
  if (fastTickHandle) clearInterval(fastTickHandle);
  fastTickHandle = setInterval(() => {
    const s = getFastState();
    if (!s.start) { clearInterval(fastTickHandle); return; }
    const timeEl = document.getElementById('fast-time');
    if (!timeEl) { clearInterval(fastTickHandle); return; }
    const elapsed = Date.now() - new Date(s.start).getTime();
    timeEl.textContent = fmtDuration(elapsed);
    const goalMs = s.goalHours * 3600 * 1000;
    const pct = Math.min(100, (elapsed / goalMs) * 100);
    const fill = document.getElementById('fast-progress');
    if (fill) {
      fill.style.width = pct + '%';
      fill.classList.toggle('complete', pct >= 100);
    }
    const remaining = goalMs - elapsed;
    const rem = document.getElementById('fast-remaining');
    if (rem) rem.textContent = remaining > 0
      ? `${fmtDurationShort(remaining)} to ${s.goalHours}h goal`
      : `+${fmtDurationShort(-remaining)} past goal`;
  }, 1000);
}

/* ===== TRENDS ===== */
function makeWeekBuckets(count) {
  const buckets = [];
  const thisStart = weekStart(new Date());
  for (let i = count - 1; i >= 0; i--) {
    const start = new Date(thisStart);
    start.setDate(thisStart.getDate() - i * 7);
    const end = new Date(start);
    end.setDate(start.getDate() + 7);
    buckets.push({ start, end });
  }
  return buckets;
}
function fmtWeekLabel(d) { return `${d.getMonth()+1}/${d.getDate()}`; }
function movingAvg(arr, days) {
  if (arr.length === 0) return null;
  const cutoff = new Date(arr[arr.length-1].date);
  cutoff.setDate(cutoff.getDate() - days);
  const recent = arr.filter(w => new Date(w.date) >= cutoff);
  if (recent.length === 0) return null;
  return recent.reduce((s, w) => s + w.value, 0) / recent.length;
}

function renderTrends() {
  const view = document.getElementById('trends-view');
  const weights = getWeights().slice().sort((a, b) => a.date.localeCompare(b.date));
  const sessions = getSessions();
  const fast = getFastState();

  const current = weights.length > 0 ? weights[weights.length - 1] : null;
  const avg7 = movingAvg(weights, 7);
  const change = weights.length > 1 ? current.value - weights[0].value : null;
  const range30 = (() => {
    if (weights.length < 2) return null;
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 30);
    const recent = weights.filter(w => new Date(w.date) >= cutoff);
    if (recent.length < 2) return null;
    return recent[recent.length-1].value - recent[0].value;
  })();

  const buckets = makeWeekBuckets(12);
  const liftCounts = buckets.map(wb => sessions.filter(s =>
    ['A','B','Custom'].includes(s.type) &&
    new Date(s.date) >= wb.start && new Date(s.date) < wb.end
  ).length);
  const milesPerWeek = buckets.map(wb => sessions.filter(s =>
    s.type === 'Walk/Run' &&
    new Date(s.date) >= wb.start && new Date(s.date) < wb.end
  ).reduce((sum, s) => sum + (s.miles || 0), 0));

  const totalMiles = sessions.filter(s => s.type === 'Walk/Run').reduce((s, x) => s + (x.miles || 0), 0);
  const last7Miles = sessions.filter(s => {
    if (s.type !== 'Walk/Run') return false;
    return Date.now() - new Date(s.date).getTime() < 7 * 86400000;
  }).reduce((sum, s) => sum + (s.miles || 0), 0);
  const totalLifts = sessions.filter(s => ['A','B','Custom'].includes(s.type)).length;

  const fastHist = fast.history.slice(-14);
  const avgFast = fastHist.length > 0
    ? fastHist.reduce((s, f) => s + (new Date(f.end) - new Date(f.start)), 0) / fastHist.length
    : 0;

  view.innerHTML = `
    <div class="section-label">Weight</div>

      <div class="head">
        <div class="title">Weight</div>

        <span>30d: <strong class="${range30 && range30 < 0 ? 'down' : range30 && range30 > 0 ? 'up' : ''}">${range30===null?'—':(range30>0?'+':'')+range30.toFixed(1)}</strong></span>

        <button class="range-tab" data-range="90">90D</button>
        <button class="range-tab" data-range="365">1Y</button>
        <button class="range-tab" data-range="0">ALL</button>
      </div>
      <div id="weight-chart"></div>
    </div>

    <div class="section-label">Lifting</div>
    <div class="trend-card">
      <div class="head">
        <div class="title">Sessions / Week</div>
        <div class="current" style="color:#E8A33D;">${liftCounts[liftCounts.length-1]}<span class="unit">this wk</span></div>
      </div>
      <div class="stats">
        <span>Goal: <strong>${WEEK_GOAL}</strong></span>
        <span>12w avg: <strong>${(liftCounts.reduce((s,c)=>s+c,0)/liftCounts.length).toFixed(1)}</strong></span>
        <span>Total: <strong>${totalLifts}</strong></span>
      </div>
      <div id="sessions-chart"></div>
    </div>

    <div class="section-label">Cardio</div>
    <div class="trend-card">
      <div class="head">
        <div class="title">Miles / Week</div>
        <div class="current" style="color:#4ECDC4;">${milesPerWeek[milesPerWeek.length-1].toFixed(1)}<span class="unit">mi</span></div>
      </div>
      <div class="stats">
        <span>Last 7d: <strong>${last7Miles.toFixed(1)} mi</strong></span>
        <span>12w avg: <strong>${(milesPerWeek.reduce((s,c)=>s+c,0)/milesPerWeek.length).toFixed(1)} mi</strong></span>
        <span>Total: <strong>${totalMiles.toFixed(1)} mi</strong></span>
      </div>

        <span>Logged: <strong>${fast.history.length}</strong></span>
      </div>
      <div id="fast-chart"></div>

  const wRange = Store.get('weightRange', '30');

    b.addEventListener('click', () => {

  renderLineChart('weight-chart', weights, parseInt(wRange), '#FF3D7F');

  renderBarChart('miles-chart', buckets.map((wb, i) => ({

  })), { unit: 'mi', decimals: 1, color: '#4ECDC4', colorDim: '#2A7873' });

function renderLineChart(elId, weights, days, color) {
  const el = document.getElementById(elId);
  const lineColor = color || 'var(--accent)';
  let data = weights;
  if (days > 0 && weights.length > 0) {
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - days);
    data = weights.filter(w => new Date(w.date) >= cutoff);
  }
  if (data.length < 2) {
    el.innerHTML = '<div class="empty">need 2+ entries</div>';
    return;
  }

  const W = 560, H = 160, P = { top: 10, right: 14, bottom: 22, left: 36 };
  const innerW = W - P.left - P.right;
  const innerH = H - P.top - P.bottom;

  const vals = data.map(d => d.value);
  let min = Math.min(...vals);
  let max = Math.max(...vals);
  const padR = Math.max(1, (max - min) * 0.15);
  min -= padR; max += padR;

  const x0 = new Date(data[0].date).getTime();
  const x1 = new Date(data[data.length-1].date).getTime();
  const xRange = Math.max(x1 - x0, 1);

  const xScale = t => P.left + ((t - x0) / xRange) * innerW;
  const yScale = v => P.top + (1 - (v - min) / (max - min)) * innerH;

  const avgData = data.map((d, i) => {
    const start = Math.max(0, i - 6);
    const slice = data.slice(start, i + 1);
    return { date: d.date, value: slice.reduce((s, x) => s + x.value, 0) / slice.length };
  });

  const dailyLine = data.map(d => `${xScale(new Date(d.date).getTime())},${yScale(d.value)}`).join(' ');
  const avgLine = avgData.map(d => `${xScale(new Date(d.date).getTime())},${yScale(d.value)}`).join(' ');
  const dots = data.map(d => `<circle cx="${xScale(new Date(d.date).getTime())}" cy="${yScale(d.value)}" r="2" fill="var(--text-muted)" />`).join('');

  const yTicks = [min + (max-min)*0.1, (min+max)/2, max - (max-min)*0.1];
  const yLabels = yTicks.map(v => `
    <text x="${P.left - 6}" y="${yScale(v) + 3}" text-anchor="end" fill="var(--text-muted)" font-size="9" font-family="JetBrains Mono">${v.toFixed(0)}</text>
    <line x1="${P.left}" x2="${W - P.right}" y1="${yScale(v)}" y2="${yScale(v)}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="2 3" />
  `).join('');

  const xLabels = [data[0], data[Math.floor(data.length/2)], data[data.length-1]].map(d => {
    const x = xScale(new Date(d.date).getTime());
    return `<text x="${x}" y="${H - 6}" text-anchor="middle" fill="var(--text-muted)" font-size="9" font-family="JetBrains Mono">${fmtDate(d.date)}</text>`;
  }).join('');

  el.innerHTML = `
    <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${yLabels}
      <polyline points="${dailyLine}" fill="none" stroke="var(--text-muted)" stroke-width="1" stroke-opacity="0.6" />
      ${dots}
      <polyline points="${avgLine}" fill="none" stroke="${lineColor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
      ${xLabels}
    </svg>
    <div class="chart-legend">
      <span><span class="swatch" style="background:${lineColor};"></span>7d avg</span>
      <span><span class="swatch" style="background:var(--text-muted);"></span>daily</span>
    </div>
  `;
}

function renderBarChart(elId, data, opts = {}) {
  const el = document.getElementById(elId);
  if (!data || data.length === 0 || data.every(d => d.value === 0)) {
    el.innerHTML = '<div class="empty">no data yet</div>';
    return;
  }
  const { goal, unit = '', decimals = 0, color, colorDim } = opts;
  const activeColor = color || 'var(--accent)';
  const dimColor = colorDim || 'var(--accent-dim)';
  const W = 560, H = 140, P = { top: 14, right: 14, bottom: 22, left: 32 };
  const innerW = W - P.left - P.right;
  const innerH = H - P.top - P.bottom;

  const max = Math.max(...data.map(d => d.value), goal || 0, 1) * 1.15;
  const barGap = 3;
  const barW = (innerW - barGap * (data.length - 1)) / data.length;

  const bars = data.map((d, i) => {
    const x = P.left + i * (barW + barGap);
    const h = (d.value / max) * innerH;
    const y = P.top + innerH - h;
    const isLast = i === data.length - 1;
    return `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(h, 1)}" fill="${isLast ? activeColor : dimColor}" rx="1" />`;
  }).join('');

  let goalLine = '';
  if (goal !== undefined && goal !== null) {
    const y = P.top + innerH - (goal / max) * innerH;
    goalLine = `
      <line x1="${P.left}" x2="${W - P.right}" y1="${y}" y2="${y}" stroke="var(--success)" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.7" />
      <text x="${W - P.right - 4}" y="${y - 3}" text-anchor="end" fill="var(--success)" font-size="9" font-family="JetBrains Mono">goal ${goal}${unit}</text>
    `;
  }

  const labelIdx = [0, Math.floor(data.length / 2), data.length - 1];
  const xLabels = labelIdx.map(i => {
    if (i >= data.length) return '';
    const x = P.left + i * (barW + barGap) + barW / 2;
    return `<text x="${x}" y="${H - 6}" text-anchor="middle" fill="var(--text-muted)" font-size="9" font-family="JetBrains Mono">${data[i].label}</text>`;
  }).join('');

  const yLabel = `<text x="${P.left - 4}" y="${P.top + 8}" text-anchor="end" fill="var(--text-muted)" font-size="9" font-family="JetBrains Mono">${max.toFixed(decimals)}${unit}</text>`;

  el.innerHTML = `
    <svg class="bar-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${yLabel}
      ${goalLine}
      ${bars}
      ${xLabels}
    </svg>
  `;
}

/* ===== DATA TAB ===== */
function renderData() {
  const view = document.getElementById('data-view');
  const fast = getFastState();
  const sessions = getSessions();
  const weights = getWeights();
  const earned = Store.get('achievements', {});
  const totalSize = KEYS.reduce((sum, k) => {
    const v = localStorage.getItem(k);
    return sum + (v ? v.length : 0);
  }, 0);

  view.innerHTML = `
    <div class="section-label">Settings</div>
    <div class="data-block">
      <h3>Fast Goal</h3>
      <p>Target hours per fast. Drives the progress bar and the goal lines in trends.</p>
      <div class="row">
        <input type="number" id="fast-goal-input" min="12" max="24" step="0.5" value="${fast.goalHours}">
        <button class="primary" id="save-goal">Save</button>
      </div>
    </div>

    <div class="section-label">Backup</div>
    <div class="data-block">
      <h3>Export</h3>
      <p>Download everything as a single JSON file. Keep it as a backup, move it to another device, or just hold onto your data for the future.</p>
      <button class="primary" id="export-btn">Download JSON</button>
    </div>

    <div class="data-block">
      <h3>Import</h3>
      <p>Restore from a JSON backup. <strong>This replaces all current data.</strong></p>
      <button class="secondary" id="import-btn">Choose File</button>
    </div>

    <div class="section-label">Storage</div>
    <div class="data-block">
      <h3>Where Your Data Lives</h3>
      <p>Everything is in your browser's <strong>localStorage</strong> on this device. Nothing is sent anywhere. Switching browsers, devices, or clearing site data starts you fresh. Export regularly if that matters to you.</p>
      <div class="key-row"><span class="k">Sessions (workouts, walks)</span><span class="v">${sessions.length}</span></div>
      <div class="key-row"><span class="k">Weight entries</span><span class="v">${weights.length}</span></div>
      <div class="key-row"><span class="k">Fasts logged</span><span class="v">${fast.history.length}</span></div>
      <div class="key-row"><span class="k">Milestones earned</span><span class="v">${Object.keys(earned).length} / ${ACHIEVEMENTS.length}</span></div>
      <div class="key-row"><span class="k">Total storage</span><span class="v">${(totalSize / 1024).toFixed(1)} KB</span></div>
    </div>

    <div class="section-label">Danger</div>
    <div class="data-block">
      <h3>Wipe All Data</h3>
      <p>Erase everything including milestones. Export first if you want a backup.</p>
      <button class="danger" id="wipe-btn">Wipe Everything</button>
    </div>

    <div class="data-block" style="border:none;background:none;text-align:center;padding-top:0;margin-top:8px;">
      <p style="margin:0;font-style:italic;font-family:var(--serif);color:var(--text-muted);">LOG · v5</p>
    </div>
  `;

  document.getElementById('save-goal').addEventListener('click', () => {
    const v = parseFloat(document.getElementById('fast-goal-input').value);
    if (isNaN(v) || v < 12 || v > 24) { showToast('Use 12–24 hours'); return; }
    const f = getFastState();
    f.goalHours = v;
    Store.set('fast', f);
    showToast('Goal saved');
  });
  document.getElementById('export-btn').addEventListener('click', exportData);
  document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-file').click());
  document.getElementById('wipe-btn').addEventListener('click', wipeData);
}

function exportData() {
  const data = {};
  KEYS.forEach(k => {
    const v = localStorage.getItem(k);
    if (v !== null) {
      try { data[k] = JSON.parse(v); } catch { data[k] = v; }
    }
  });
  const out = {
    meta: { app: 'LOG', version: 5, exportedAt: new Date().toISOString() },
    data
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `log-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Exported');
}

document.getElementById('import-file').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const data = parsed.data || parsed;
      if (!confirm('This will replace ALL current data. Continue?')) {
        e.target.value = '';
        return;
      }
      KEYS.forEach(k => {
        if (data[k] !== undefined) Store.set(k, data[k]);
      });
      showToast('Imported');
      renderLog();
      renderData();
      checkAchievements();
    } catch {
      showToast('Invalid file');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

function wipeData() {
  if (!confirm('Erase ALL data? This cannot be undone.')) return;
  if (!confirm('Really sure? Last chance.')) return;
  KEYS.forEach(k => Store.remove(k));
  showToast('Wiped');
  renderLog();
  renderData();
}

/* ===== INIT ===== */
function init() {
  updateHeader();
  setTab(Store.get('lastTab', 'log'));
  setInterval(updateHeader, 60000);
  // Check achievements on load (silent, just to back-populate earned from existing data)
  checkAchievements();
}
init();
</script>
