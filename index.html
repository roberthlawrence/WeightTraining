<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LOG — Lift / Fast / Weigh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110F;
    --surface: #1C1815;
    --surface-2: #241F1B;
    --border: #2E2823;
    --text: #F5F1EA;
    --text-dim: #8A8278;
    --text-muted: #5A5249;
    --accent: #E8A33D;
    --accent-dim: #8A6224;
    --danger: #C45842;
    --success: #7FA86B;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
    --serif: 'Fraunces', Georgia, serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.5;
    overscroll-behavior-y: contain;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
    background-image:
      radial-gradient(ellipse at top, rgba(232,163,61,0.04) 0%, transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(124,168,107,0.02) 0%, transparent 50%);
  }

  header {
    padding: max(20px, env(safe-area-inset-top)) 20px 16px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-family: var(--serif);
    font-weight: 800;
    font-size: 28px;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  header h1 .dot { color: var(--accent); }

  header .date {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  main {
    padding: 24px 20px 100px;
    max-width: 600px;
    margin: 0 auto;
  }

  .tab { display: none; }
  .tab.active { display: block; animation: fadeIn 0.25s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  /* ---- WORKOUTS ---- */

  .week-summary {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px;
    margin-bottom: 24px;
  }

  .week-summary .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--text-muted);
  }

  .week-summary .count {
    font-family: var(--serif);
    font-weight: 800;
    font-size: 48px;
    line-height: 1;
    margin: 8px 0 4px;
    letter-spacing: -0.03em;
  }

  .week-summary .count .of {
    color: var(--text-muted);
    font-size: 24px;
  }

  .week-summary .progress-dots {
    display: flex;
    gap: 6px;
    margin-top: 16px;
  }

  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 1px solid var(--border);
  }

  .dot.filled {
    background: var(--accent);
    border-color: var(--accent);
  }

  .week-summary .message {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 14px;
    font-style: italic;
    font-family: var(--serif);
  }

  .workout-cards {
    display: grid;
    gap: 12px;
  }

  .workout-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 18px 20px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
    color: inherit;
    font: inherit;
    width: 100%;
  }

  .workout-card:active {
    transform: scale(0.98);
    background: var(--surface-2);
  }

  .workout-card .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .workout-card .title {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 20px;
  }

  .workout-card .badge {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 2px;
  }

  .workout-card .focus {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  .workout-card .exercises {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.7;
  }

  /* ---- ACTIVE WORKOUT ---- */

  .active-workout {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px;
  }

  .active-workout h2 {
    font-family: var(--serif);
    font-size: 24px;
    margin-bottom: 4px;
  }

  .active-workout .focus {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 20px;
  }

  .exercise-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-top: 1px solid var(--border);
    cursor: pointer;
  }

  .exercise-row:last-of-type { border-bottom: 1px solid var(--border); }

  .checkbox {
    width: 22px;
    height: 22px;
    border: 1.5px solid var(--text-muted);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .checkbox.checked {
    background: var(--accent);
    border-color: var(--accent);
  }

  .checkbox.checked::after {
    content: '✓';
    color: var(--bg);
    font-weight: 700;
    font-size: 14px;
  }

  .exercise-row.done .exercise-name {
    color: var(--text-muted);
    text-decoration: line-through;
  }

  .exercise-info { flex: 1; }

  .exercise-name {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 2px;
  }

  .exercise-sets {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  .button-row {
    display: flex;
    gap: 10px;
    margin-top: 24px;
  }

  button.primary, button.secondary {
    flex: 1;
    padding: 16px;
    border: none;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: all 0.15s;
  }

  button.primary {
    background: var(--accent);
    color: var(--bg);
  }

  button.primary:active { background: #C8881F; transform: scale(0.98); }
  button.primary:disabled { background: var(--surface-2); color: var(--text-muted); cursor: not-allowed; }

  button.secondary {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
  }

  button.secondary:active { background: var(--surface-2); }

  /* ---- HISTORY ---- */

  .history-section { margin-top: 32px; }

  .history-item {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }

  .history-item .date { color: var(--text-dim); }
  .history-item .type { color: var(--accent); font-weight: 600; }

  /* ---- FAST ---- */

  .timer-display {
    text-align: center;
    padding: 32px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }

  .timer-status {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .timer-status.active { color: var(--accent); }

  .timer-time {
    font-family: var(--serif);
    font-weight: 800;
    font-size: 56px;
    line-height: 1;
    letter-spacing: -0.04em;
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }

  .timer-time.dim { color: var(--text-muted); }

  .timer-sub {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }

  .progress-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 24px 0 12px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.5s ease;
    border-radius: 2px;
  }

  .progress-fill.complete {
    background: var(--success);
  }

  .timer-meta {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
  }

  .goal-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    margin-bottom: 20px;
  }

  .goal-row label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-dim);
  }

  .goal-row input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 3px;
    width: 80px;
    text-align: center;
  }

  /* ---- WEIGHT ---- */

  .weight-current {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 24px 20px;
    margin-bottom: 16px;
  }

  .weight-current .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .weight-current .value {
    font-family: var(--serif);
    font-weight: 800;
    font-size: 56px;
    line-height: 1;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
  }

  .weight-current .value .unit {
    font-size: 18px;
    color: var(--text-muted);
    margin-left: 4px;
  }

  .weight-meta {
    display: flex;
    gap: 24px;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .weight-meta .stat .label {
    font-size: 9px;
    margin-bottom: 4px;
  }

  .weight-meta .stat .num {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 18px;
    font-variant-numeric: tabular-nums;
  }

  .weight-meta .stat .num.down { color: var(--success); }
  .weight-meta .stat .num.up { color: var(--danger); }

  .weight-input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }

  .weight-input-row input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 18px;
    padding: 16px;
    border-radius: 4px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .weight-input-row input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .weight-input-row button {
    padding: 16px 24px;
  }

  .chart-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
  }

  .chart-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-dim);
  }

  .range-tabs {
    display: flex;
    gap: 4px;
  }

  .range-tab {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: var(--mono);
    font-size: 10px;
    padding: 4px 10px;
    border-radius: 2px;
    cursor: pointer;
    letter-spacing: 0.1em;
  }

  .range-tab.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }

  svg.chart {
    width: 100%;
    height: 180px;
    display: block;
  }

  .chart-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 12px;
    font-style: italic;
    font-family: var(--serif);
  }

  /* ---- NAV ---- */

  nav.tabbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(20, 17, 15, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 8px max(8px, env(safe-area-inset-bottom));
    z-index: 100;
  }

  nav.tabbar button {
    flex: 1;
    background: none;
    border: none;
    padding: 12px 8px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    color: var(--text-muted);
    cursor: pointer;
    text-transform: uppercase;
    border-radius: 4px;
    transition: color 0.15s;
  }

  nav.tabbar button.active {
    color: var(--accent);
  }

  nav.tabbar button .num {
    display: block;
    font-size: 9px;
    margin-bottom: 2px;
    opacity: 0.6;
  }

  /* ---- TOAST ---- */

  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    z-index: 200;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ---- UTILITY ---- */

  .delete-link {
    background: none;
    border: none;
    color: var(--danger);
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    cursor: pointer;
    padding: 0;
  }

  @media (max-height: 700px) {
    .timer-time, .weight-current .value { font-size: 44px; }
    .week-summary .count { font-size: 40px; }
  }
</style>
</head>
<body>

<header>
  <h1>LOG<span class="dot">.</span></h1>
  <div class="date" id="header-date"></div>
</header>

<main>

  <!-- LIFT TAB -->
  <section class="tab active" data-tab="lift">
    <div id="lift-view"></div>
  </section>

  <!-- FAST TAB -->
  <section class="tab" data-tab="fast">
    <div class="section-label">Fasting Window</div>
    <div class="timer-display">
      <div class="timer-status" id="fast-status">Not Fasting</div>
      <div class="timer-time" id="fast-time">00:00:00</div>
      <div class="timer-sub" id="fast-sub">tap start when you finish eating</div>
      <div class="progress-track">
        <div class="progress-fill" id="fast-progress" style="width: 0%"></div>
      </div>
      <div class="timer-meta">
        <span id="fast-meta-left">Goal: 17h</span>
        <span id="fast-meta-right">—</span>
      </div>
    </div>

    <div class="goal-row">
      <label>Fast Goal (hours)</label>
      <input type="number" id="fast-goal" min="12" max="24" step="0.5">
    </div>

    <div class="button-row">
      <button class="primary" id="fast-toggle">Start Fast</button>
    </div>

    <div class="history-section">
      <div class="section-label">Recent Fasts</div>
      <div id="fast-history"></div>
    </div>
  </section>

  <!-- WEIGH TAB -->
  <section class="tab" data-tab="weigh">
    <div class="section-label">Today</div>
    <div class="weight-current">
      <div class="label">Current</div>
      <div class="value" id="weight-current">— <span class="unit">lb</span></div>
      <div class="weight-meta">
        <div class="stat">
          <div class="label">7-Day Avg</div>
          <div class="num" id="weight-avg">—</div>
        </div>
        <div class="stat">
          <div class="label">From Start</div>
          <div class="num" id="weight-change">—</div>
        </div>
        <div class="stat">
          <div class="label">Entries</div>
          <div class="num" id="weight-entries">—</div>
        </div>
      </div>
    </div>

    <div class="weight-input-row">
      <input type="number" id="weight-input" step="0.1" placeholder="enter weight" inputmode="decimal">
      <button class="primary" id="weight-save">Save</button>
    </div>

    <div class="chart-container">
      <div class="chart-header">
        <div class="chart-title">Trend</div>
        <div class="range-tabs">
          <button class="range-tab active" data-range="30">30D</button>
          <button class="range-tab" data-range="90">90D</button>
          <button class="range-tab" data-range="365">1Y</button>
          <button class="range-tab" data-range="0">ALL</button>
        </div>
      </div>
      <div id="chart-area"></div>
    </div>

    <div class="history-section">
      <div class="section-label">Recent Entries</div>
      <div id="weight-history"></div>
    </div>
  </section>

</main>

<nav class="tabbar">
  <button data-target="lift" class="active">LIFT</button>
  <button data-target="fast">FAST</button>
  <button data-target="weigh">WEIGH</button>
</nav>

<div class="toast" id="toast"></div>

<script>
'use strict';

/* ========== STORAGE ========== */
const Store = {
  get(key, fallback) {
    try {
      const v = localStorage.getItem(key);
      return v === null ? fallback : JSON.parse(v);
    } catch { return fallback; }
  },
  set(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
  }
};

/* ========== PROGRAM DATA ========== */
const PROGRAM = {
  A: {
    title: 'Workout A',
    focus: 'Push / Squat / Core',
    exercises: [
      { name: 'Goblet Squat to Chair',    sets: '3 × 10' },
      { name: 'Push-Ups',                 sets: '3 × max-1' },
      { name: 'Single-Arm DB Row',        sets: '3 × 10 / side' },
      { name: 'Glute Bridge / Hip Thrust',sets: '3 × 15' },
      { name: 'Plank',                    sets: '3 × 30–45s' }
    ]
  },
  B: {
    title: 'Workout B',
    focus: 'Hinge / Pull / Core',
    exercises: [
      { name: 'Romanian Deadlift (DB)',   sets: '3 × 10' },
      { name: 'Reverse Lunge',            sets: '3 × 8 / side' },
      { name: 'Overhead Press (DB)',      sets: '3 × 8–10' },
      { name: 'Dead Bug',                 sets: '3 × 10 / side' },
      { name: 'Side Plank',               sets: '3 × 20–30s / side' }
    ]
  }
};

const WEEK_GOAL = 2; // sessions per week target

/* ========== UTILS ========== */
function pad(n) { return String(n).padStart(2, '0'); }

function fmtDuration(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return `${pad(h)}:${pad(m)}:${pad(sec)}`;
}

function fmtDurationShort(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  return `${h}h ${m}m`;
}

function isoWeek(d) {
  d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return `${d.getUTCFullYear()}-W${pad(weekNo)}`;
}

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function fmtDateLong(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ========== HEADER ========== */
function updateHeader() {
  const d = new Date();
  const opts = { weekday: 'short', month: 'short', day: 'numeric' };
  document.getElementById('header-date').textContent =
    d.toLocaleDateString('en-US', opts).toUpperCase();
}

/* ========== TABS ========== */
function setTab(name) {
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === name);
  });
  document.querySelectorAll('nav.tabbar button').forEach(b => {
    b.classList.toggle('active', b.dataset.target === name);
  });
  Store.set('lastTab', name);
}

document.querySelectorAll('nav.tabbar button').forEach(b => {
  b.addEventListener('click', () => setTab(b.dataset.target));
});

/* ========== LIFT ========== */
function getSessions() {
  return Store.get('sessions', []);
}

function thisWeekSessions() {
  const week = isoWeek(new Date());
  return getSessions().filter(s => isoWeek(new Date(s.date)) === week);
}

function nextSuggestedWorkout() {
  const sessions = getSessions();
  if (sessions.length === 0) return 'A';
  const last = sessions[sessions.length - 1];
  return last.type === 'A' ? 'B' : 'A';
}

function renderLift() {
  const view = document.getElementById('lift-view');
  const active = Store.get('activeWorkout', null);

  if (active) {
    renderActiveWorkout(view, active);
  } else {
    renderLiftHome(view);
  }
}

function renderLiftHome(view) {
  const weekSessions = thisWeekSessions();
  const count = weekSessions.length;
  const suggested = nextSuggestedWorkout();

  const dotsHtml = Array.from({ length: WEEK_GOAL }, (_, i) =>
    `<div class="dot ${i < count ? 'filled' : ''}"></div>`
  ).join('') + (count > WEEK_GOAL
    ? Array.from({ length: count - WEEK_GOAL }, () => '<div class="dot filled"></div>').join('')
    : '');

  let msg;
  if (count === 0) msg = `Start with ${suggested}. The first rep is the work.`;
  else if (count < WEEK_GOAL) msg = `${WEEK_GOAL - count} more to hit the week. Suggested: ${suggested}.`;
  else if (count === WEEK_GOAL) msg = `Goal hit. Anything more is bonus.`;
  else msg = `${count - WEEK_GOAL} over goal. Showing up matters.`;

  const allSessions = getSessions().slice().reverse().slice(0, 10);
  const historyHtml = allSessions.length === 0
    ? '<div style="color: var(--text-muted); font-size: 12px; padding: 12px 0; font-style: italic; font-family: var(--serif);">No sessions yet.</div>'
    : allSessions.map(s => `
        <div class="history-item">
          <span class="date">${fmtDateLong(s.date)}</span>
          <span class="type">${s.type}</span>
        </div>`).join('');

  view.innerHTML = `
    <div class="section-label">This Week</div>
    <div class="week-summary">
      <div class="label">Sessions</div>
      <div class="count">${count}<span class="of"> / ${WEEK_GOAL}</span></div>
      <div class="progress-dots">${dotsHtml}</div>
      <div class="message">${msg}</div>
    </div>

    <div class="section-label">Start Session</div>
    <div class="workout-cards">
      ${renderWorkoutCard('A', suggested === 'A')}
      ${renderWorkoutCard('B', suggested === 'B')}
    </div>

    <div class="history-section">
      <div class="section-label">Recent</div>
      ${historyHtml}
    </div>
  `;

  view.querySelectorAll('[data-start]').forEach(btn => {
    btn.addEventListener('click', () => startWorkout(btn.dataset.start));
  });
}

function renderWorkoutCard(type, suggested) {
  const w = PROGRAM[type];
  const exercisesShort = w.exercises.map(e => e.name).join(' · ');
  return `
    <button class="workout-card" data-start="${type}">
      <div class="header">
        <div class="title">${w.title}</div>
        <div class="badge">${suggested ? 'Suggested' : type}</div>
      </div>
      <div class="focus">${w.focus}</div>
      <div class="exercises">${exercisesShort}</div>
    </button>
  `;
}

function startWorkout(type) {
  Store.set('activeWorkout', {
    type,
    started: new Date().toISOString(),
    completed: PROGRAM[type].exercises.map(() => false)
  });
  renderLift();
}

function renderActiveWorkout(view, active) {
  const w = PROGRAM[active.type];
  const doneCount = active.completed.filter(Boolean).length;
  const total = w.exercises.length;
  const allDone = doneCount === total;

  view.innerHTML = `
    <div class="section-label">In Progress</div>
    <div class="active-workout">
      <h2>${w.title}</h2>
      <div class="focus">${w.focus} · ${doneCount} of ${total} done</div>
      ${w.exercises.map((ex, i) => `
        <div class="exercise-row ${active.completed[i] ? 'done' : ''}" data-i="${i}">
          <div class="checkbox ${active.completed[i] ? 'checked' : ''}"></div>
          <div class="exercise-info">
            <div class="exercise-name">${ex.name}</div>
            <div class="exercise-sets">${ex.sets}</div>
          </div>
        </div>
      `).join('')}
      <div class="button-row">
        <button class="secondary" id="cancel-workout">Cancel</button>
        <button class="primary" id="finish-workout" ${!allDone ? 'disabled' : ''}>
          ${allDone ? 'Finish' : `${doneCount}/${total}`}
        </button>
      </div>
    </div>
  `;

  view.querySelectorAll('.exercise-row').forEach(row => {
    row.addEventListener('click', () => {
      const i = parseInt(row.dataset.i);
      active.completed[i] = !active.completed[i];
      Store.set('activeWorkout', active);
      renderActiveWorkout(view, active);
    });
  });

  document.getElementById('cancel-workout').addEventListener('click', () => {
    if (confirm('Cancel this workout? Progress will be lost.')) {
      Store.set('activeWorkout', null);
      renderLift();
    }
  });

  document.getElementById('finish-workout').addEventListener('click', () => {
    const sessions = getSessions();
    sessions.push({
      type: active.type,
      date: new Date().toISOString()
    });
    Store.set('sessions', sessions);
    Store.set('activeWorkout', null);
    showToast(`${w.title} logged`);
    renderLift();
  });
}

/* ========== FAST ========== */
let fastTickHandle = null;

function getFastState() {
  return Store.get('fast', { start: null, goalHours: 17, history: [] });
}

function saveFastState(s) { Store.set('fast', s); }

function renderFast() {
  const s = getFastState();
  document.getElementById('fast-goal').value = s.goalHours;

  const status = document.getElementById('fast-status');
  const time = document.getElementById('fast-time');
  const sub = document.getElementById('fast-sub');
  const fill = document.getElementById('fast-progress');
  const left = document.getElementById('fast-meta-left');
  const right = document.getElementById('fast-meta-right');
  const btn = document.getElementById('fast-toggle');

  const goalMs = s.goalHours * 3600 * 1000;

  if (s.start) {
    const elapsed = Date.now() - new Date(s.start).getTime();
    const pct = Math.min(100, (elapsed / goalMs) * 100);
    const remaining = goalMs - elapsed;

    status.textContent = pct >= 100 ? 'Goal Hit · Keep Going' : 'Fasting';
    status.classList.add('active');
    time.textContent = fmtDuration(elapsed);
    time.classList.remove('dim');
    sub.textContent = `started ${new Date(s.start).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' })}`;
    fill.style.width = pct + '%';
    fill.classList.toggle('complete', pct >= 100);
    left.textContent = `Goal: ${s.goalHours}h`;
    right.textContent = remaining > 0
      ? `${fmtDurationShort(remaining)} to goal`
      : `+${fmtDurationShort(-remaining)} past goal`;
    btn.textContent = 'End Fast';
    btn.style.background = 'var(--danger)';
  } else {
    status.textContent = 'Not Fasting';
    status.classList.remove('active');
    time.textContent = '00:00:00';
    time.classList.add('dim');
    sub.textContent = 'tap start when you finish eating';
    fill.style.width = '0%';
    fill.classList.remove('complete');
    left.textContent = `Goal: ${s.goalHours}h`;
    right.textContent = '—';
    btn.textContent = 'Start Fast';
    btn.style.background = '';
  }

  // History
  const hist = document.getElementById('fast-history');
  if (s.history.length === 0) {
    hist.innerHTML = '<div style="color: var(--text-muted); font-size: 12px; padding: 12px 0; font-style: italic; font-family: var(--serif);">No fasts logged yet.</div>';
  } else {
    hist.innerHTML = s.history.slice().reverse().slice(0, 8).map(f => {
      const dur = new Date(f.end) - new Date(f.start);
      const hours = dur / 3600 / 1000;
      const hit = hours >= f.goal;
      return `
        <div class="history-item">
          <span class="date">${fmtDateLong(f.end)}</span>
          <span class="type" style="color: ${hit ? 'var(--success)' : 'var(--text-dim)'};">${fmtDurationShort(dur)}</span>
        </div>`;
    }).join('');
  }
}

function startFastTick() {
  if (fastTickHandle) clearInterval(fastTickHandle);
  fastTickHandle = setInterval(() => {
    const s = getFastState();
    if (!s.start) { clearInterval(fastTickHandle); return; }
    const elapsed = Date.now() - new Date(s.start).getTime();
    document.getElementById('fast-time').textContent = fmtDuration(elapsed);
    const goalMs = s.goalHours * 3600 * 1000;
    const pct = Math.min(100, (elapsed / goalMs) * 100);
    document.getElementById('fast-progress').style.width = pct + '%';
    document.getElementById('fast-progress').classList.toggle('complete', pct >= 100);
    const remaining = goalMs - elapsed;
    document.getElementById('fast-meta-right').textContent = remaining > 0
      ? `${fmtDurationShort(remaining)} to goal`
      : `+${fmtDurationShort(-remaining)} past goal`;
    if (pct >= 100) {
      document.getElementById('fast-status').textContent = 'Goal Hit · Keep Going';
    }
  }, 1000);
}

document.getElementById('fast-toggle').addEventListener('click', () => {
  const s = getFastState();
  if (s.start) {
    const end = new Date().toISOString();
    s.history.push({ start: s.start, end, goal: s.goalHours });
    const dur = new Date(end) - new Date(s.start);
    s.start = null;
    saveFastState(s);
    showToast(`Fast: ${fmtDurationShort(dur)}`);
    renderFast();
    if (fastTickHandle) clearInterval(fastTickHandle);
  } else {
    s.start = new Date().toISOString();
    saveFastState(s);
    renderFast();
    startFastTick();
    showToast('Fast started');
  }
});

document.getElementById('fast-goal').addEventListener('change', (e) => {
  const v = parseFloat(e.target.value);
  if (isNaN(v) || v < 12 || v > 24) { renderFast(); return; }
  const s = getFastState();
  s.goalHours = v;
  saveFastState(s);
  renderFast();
});

/* ========== WEIGHT ========== */
function getWeights() {
  return Store.get('weights', []);
}

function setWeights(w) { Store.set('weights', w); }

function movingAvg(arr, days) {
  if (arr.length === 0) return null;
  const cutoff = new Date(arr[arr.length-1].date);
  cutoff.setDate(cutoff.getDate() - days);
  const recent = arr.filter(w => new Date(w.date) >= cutoff);
  if (recent.length === 0) return null;
  return recent.reduce((s, w) => s + w.value, 0) / recent.length;
}

function renderWeight() {
  const weights = getWeights().slice().sort((a, b) => a.date.localeCompare(b.date));
  const current = weights.length > 0 ? weights[weights.length - 1] : null;
  const avg = movingAvg(weights, 7);
  const change = weights.length > 1 ? current.value - weights[0].value : null;

  document.getElementById('weight-current').innerHTML = current
    ? `${current.value.toFixed(1)}<span class="unit">lb</span>`
    : `—<span class="unit">lb</span>`;

  document.getElementById('weight-avg').textContent = avg ? avg.toFixed(1) : '—';
  document.getElementById('weight-entries').textContent = weights.length || '—';

  const changeEl = document.getElementById('weight-change');
  if (change === null) {
    changeEl.textContent = '—';
    changeEl.className = 'num';
  } else {
    changeEl.textContent = `${change > 0 ? '+' : ''}${change.toFixed(1)}`;
    changeEl.className = 'num ' + (change < 0 ? 'down' : change > 0 ? 'up' : '');
  }

  const range = parseInt(Store.get('weightRange', '30'));
  renderChart(weights, range);

  // history
  const hist = document.getElementById('weight-history');
  const recent = weights.slice().reverse().slice(0, 10);
  hist.innerHTML = recent.length === 0
    ? '<div style="color: var(--text-muted); font-size: 12px; padding: 12px 0; font-style: italic; font-family: var(--serif);">No entries yet.</div>'
    : recent.map(w => `
        <div class="history-item">
          <span class="date">${fmtDateLong(w.date)}</span>
          <span><span class="type">${w.value.toFixed(1)} lb</span>
            <button class="delete-link" data-del="${w.date}" style="margin-left: 12px;">×</button>
          </span>
        </div>`).join('');

  hist.querySelectorAll('[data-del]').forEach(b => {
    b.addEventListener('click', () => {
      if (!confirm('Delete this entry?')) return;
      const w = getWeights().filter(x => x.date !== b.dataset.del);
      setWeights(w);
      renderWeight();
    });
  });
}

function renderChart(weights, days) {
  const area = document.getElementById('chart-area');
  let data = weights;
  if (days > 0 && weights.length > 0) {
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - days);
    data = weights.filter(w => new Date(w.date) >= cutoff);
  }

  if (data.length < 2) {
    area.innerHTML = '<div class="chart-empty">need 2+ entries to draw a trend</div>';
    return;
  }

  const W = 560, H = 180, P = { top: 10, right: 14, bottom: 22, left: 36 };
  const innerW = W - P.left - P.right;
  const innerH = H - P.top - P.bottom;

  const vals = data.map(d => d.value);
  let min = Math.min(...vals);
  let max = Math.max(...vals);
  const pad = Math.max(1, (max - min) * 0.15);
  min -= pad; max += pad;

  const x0 = new Date(data[0].date).getTime();
  const x1 = new Date(data[data.length-1].date).getTime();
  const xRange = Math.max(x1 - x0, 1);

  const xScale = t => P.left + ((t - x0) / xRange) * innerW;
  const yScale = v => P.top + (1 - (v - min) / (max - min)) * innerH;

  // 7-day moving average series
  const avgData = data.map((d, i) => {
    const start = Math.max(0, i - 6);
    const slice = data.slice(start, i + 1);
    const a = slice.reduce((s, x) => s + x.value, 0) / slice.length;
    return { date: d.date, value: a };
  });

  const pointsLine = data.map(d => `${xScale(new Date(d.date).getTime())},${yScale(d.value)}`).join(' ');
  const avgLine = avgData.map(d => `${xScale(new Date(d.date).getTime())},${yScale(d.value)}`).join(' ');

  const dots = data.map(d => `<circle cx="${xScale(new Date(d.date).getTime())}" cy="${yScale(d.value)}" r="2" fill="var(--text-muted)" />`).join('');

  // y axis labels
  const yTicks = [min + (max-min)*0.1, (min+max)/2, max - (max-min)*0.1];
  const yLabels = yTicks.map(v => `
    <text x="${P.left - 6}" y="${yScale(v) + 3}" text-anchor="end" fill="var(--text-muted)" font-size="9" font-family="var(--mono)">${v.toFixed(0)}</text>
    <line x1="${P.left}" x2="${W - P.right}" y1="${yScale(v)}" y2="${yScale(v)}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="2 3" />
  `).join('');

  // x axis labels (first, middle, last)
  const xLabels = [data[0], data[Math.floor(data.length/2)], data[data.length-1]].map(d => {
    const x = xScale(new Date(d.date).getTime());
    return `<text x="${x}" y="${H - 6}" text-anchor="middle" fill="var(--text-muted)" font-size="9" font-family="var(--mono)">${fmtDate(d.date)}</text>`;
  }).join('');

  area.innerHTML = `
    <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${yLabels}
      <polyline points="${pointsLine}" fill="none" stroke="var(--text-muted)" stroke-width="1" stroke-opacity="0.6" />
      ${dots}
      <polyline points="${avgLine}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
      ${xLabels}
    </svg>
    <div style="display: flex; gap: 16px; font-size: 10px; color: var(--text-muted); margin-top: 8px; padding-left: 36px;">
      <span><span style="display: inline-block; width: 10px; height: 2px; background: var(--accent); vertical-align: middle; margin-right: 4px;"></span>7d avg</span>
      <span><span style="display: inline-block; width: 10px; height: 1px; background: var(--text-muted); vertical-align: middle; margin-right: 4px;"></span>daily</span>
    </div>
  `;
}

document.getElementById('weight-save').addEventListener('click', () => {
  const input = document.getElementById('weight-input');
  const v = parseFloat(input.value);
  if (isNaN(v) || v < 50 || v > 700) {
    showToast('Enter a valid weight');
    return;
  }
  const date = todayISO();
  const weights = getWeights().filter(w => w.date !== date);
  weights.push({ date, value: v });
  setWeights(weights);
  input.value = '';
  showToast('Saved');
  renderWeight();
});

document.getElementById('weight-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('weight-save').click();
});

document.querySelectorAll('.range-tab').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.range-tab').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    Store.set('weightRange', b.dataset.range);
    renderWeight();
  });
});

/* ========== INIT ========== */
function init() {
  updateHeader();

  // Restore last tab
  const last = Store.get('lastTab', 'lift');
  setTab(last);

  // Restore weight range
  const range = Store.get('weightRange', '30');
  document.querySelectorAll('.range-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.range === String(range));
  });

  renderLift();
  renderFast();
  renderWeight();

  // Start fast tick if fasting
  const s = getFastState();
  if (s.start) startFastTick();

  // Keep header date fresh
  setInterval(updateHeader, 60000);
}

init();
</script>
